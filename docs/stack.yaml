# Every chosen component, why it was chosen, what lost, and when to look again.
# The stack review (AGENTS.md) goes through this file; scripts/check-stack.py
# fails if something in the catalog, core or the nvim plugin list has no entry.
# last_reviewed is the date of the last full review.
last_reviewed: 2026-11-04

components:
  # --- how the dotfiles work -------------------------------------------------
  - name: chezmoi
    role: dotfiles manager (symlink mode, templates, machine data)
    why: one static binary, works anywhere incl. work laptops; templates and per-machine data without Nix's weight
    alternatives: [Nix + home-manager (two package managers on Arch, steep), GNU Stow (whole files only)]
    revisit_if: "the Mac moves to nix-darwin or a machine to NixOS; chezmoi changes symlink mode or data merging"
  - name: gum
    role: installer menus (rig setup)
    why: multi-select with pre-ticked items, confirm and input screens in one small binary
    alternatives: [fzf-only menus (no pre-ticked multi-select), dialog/whiptail (dated)]
    revisit_if: "gum is unmaintained or its choose/--selected flags change"
  - name: rclone
    role: srv mounts (nfsmount on macOS, FUSE mount on Linux)
    why: no macFUSE or system settings on macOS; through the normal ssh
    alternatives: [sshfs + macFUSE (kernel extension), macFUSE FSKit backend (new, reported read/write problems in 2026)]
    revisit_if: "macFUSE's FSKit backend matures (no-kext sshfs); rclone nfsmount needs sudo on macOS; FUSE-T becomes standard"
  - name: fuse3
    role: FUSE on Linux for srv
    why: in the kernel, no root needed
    alternatives: [rclone nfsmount on Linux (needs root)]
    revisit_if: "never really; only if srv changes method"

  # --- core packages ---------------------------------------------------------
  - {name: bash, role: "runs rig (needs 4+; Homebrew's on macOS, which ships 3.2)", why: "rig is bash; the system one everywhere else", alternatives: [], revisit_if: "never really"}
  - {name: zsh, role: shell, why: "already used; fast with our own small plugin setup", alternatives: [fish (not POSIX-ish), bash], revisit_if: "never really"}
  - {name: tmux, role: terminal multiplexer, why: "workspaces, popups, works over SSH", alternatives: [zellij (heavier, different keys), Ghostty splits (local only)], revisit_if: "extended-keys or passthrough handling changes"}
  - {name: neovim, role: editor, why: "keyboard-first, fast, vim.pack built in since 0.12", alternatives: [Zed (GUI), Helix (no plugins)], revisit_if: "a 0.x release deprecates vim.pack APIs we use"}
  - {name: git, role: version control, why: required, alternatives: [], revisit_if: never}
  - {name: openssh, role: ssh client + agent, why: required for git accounts and srv, alternatives: [], revisit_if: never}
  - {name: curl, role: downloads, why: required by installers, alternatives: [], revisit_if: never}
  - {name: unzip, role: archives, why: Mason and downloads need it, alternatives: [], revisit_if: never}
  - {name: build-tools, role: C compiler + make, why: treesitter parsers compile locally, alternatives: [], revisit_if: "nvim-treesitter ships prebuilt parsers"}
  - {name: tree-sitter-cli, role: parser builds, why: nvim-treesitter main branch needs it, alternatives: [], revisit_if: "nvim-treesitter stops needing it"}
  - {name: fzf, role: fuzzy finder, why: "shell keys, pickers (dev, srv), fzf-lua", alternatives: [skim], revisit_if: never really}
  - {name: ripgrep, role: search, why: "fast grep; fzf-lua and grug-far use it", alternatives: [], revisit_if: never}
  - {name: fd, role: find files, why: "fast; fzf and pickers use it", alternatives: [], revisit_if: never}

  # --- catalog items -----------------------------------------------------------
  - {name: zoxide, role: cd to frequent folders, why: small and fast, alternatives: [autojump], revisit_if: never really}
  - {name: eza, role: ls, why: "git status and icons; maintained successor of exa", alternatives: [lsd], revisit_if: "eza becomes unmaintained"}
  - {name: bat, role: cat with highlighting, why: "fzf previews and man pages", alternatives: [], revisit_if: never}
  - {name: delta, role: git diffs, why: "readable diffs in git and lazygit", alternatives: [difftastic (structural, slower)], revisit_if: "lazygit's diffRenderers config changes again"}
  - {name: lazygit, role: git UI, why: "hunk staging for reviewing agents' work", alternatives: [neogit, fugitive, gitui], revisit_if: "config keys renamed (pagers -> diffRenderers happened in 0.66)"}
  - {name: jq, role: JSON tool, why: extra, alternatives: [], revisit_if: never}
  - {name: tealdeer, role: tldr pages, why: extra, alternatives: [tldr (node)], revisit_if: never}
  - {name: ghostty, role: terminal, why: "fast, native on Linux and macOS, one config, modern keyboard protocol; each window opens in tmux (its own session), so tabs and splits are tmux's on every OS", alternatives: [Ghostty's own tabs (local only, differ per OS), Konsole (KDE only), iTerm2 (macOS only), kitty, WezTerm], revisit_if: "a 2.0 release, or the GTK/KDE integration changes; packaged for Debian/Fedora (then widen platforms)"}
  - {name: nerd-font, role: font with icons, why: "nvim, eza and the prompt use the icons", alternatives: [], revisit_if: never}
  - {name: clipboard, role: wl-clipboard / xclip / win32yank, why: system clipboard on Linux and WSL, alternatives: [], revisit_if: never}
  - {name: wm, role: "keyboard-driven desktop (KDE shortcuts, AeroSpace + Maccy, GlazeWM on Windows)", why: "one keymap across KDE, macOS and Windows without fragile tiling scripts; GlazeWM: open source (GPL-3.0), i3-like, one YAML config, on winget", alternatives: [Krohnkite (breaks on Plasma updates), yabai (needs SIP off), Raycast (closed), komorebi (Windows; own non-open-source licence), FancyZones (zones, not tiling)], revisit_if: "KDE renames kglobalshortcutsrc actions; AeroSpace reaches 1.0 or needs SIP changes; GlazeWM's releases stall (last v3.10.1, 2026-03) or its config schema changes"}
  - {name: windows-terminal, role: the terminal on Windows, why: "ships with Windows 11; fragments let rig add the scheme and profile without owning settings.json", alternatives: [WezTerm (another config to keep), Ghostty (no Windows build)], revisit_if: "fragments stop updating WSL profiles; Ghostty ships for Windows"}
  - {name: powertoys, role: "Windows utilities: Command Palette (launcher), always set up", why: "the owner uses it everywhere; Command Palette is the launcher GlazeWM lacks; configurable through PowerToys.DSC.exe (no PowerShell modules)", alternatives: [Flow Launcher (another app), Windows Start search (slow, ads)], revisit_if: "PowerToys.DSC.exe changes its CLI or resources; Command Palette's settings move into DSC"}
  - {name: yazi, role: terminal file manager, why: fast, previews, alternatives: [lf, ranger], revisit_if: never really}
  - {name: btop, role: system monitor, why: extra, alternatives: [htop], revisit_if: never}
  - {name: podman, role: containers on client machines (rootless, Docker-compatible), why: "rootless by default (no root-equivalent docker group, safer for agent sandboxes), no daemon, packaged everywhere, no licences; podman machine on macOS", alternatives: [Docker Engine (root daemon + docker group), Docker Desktop (licence in larger companies), Colima, OrbStack (closed), Apple container (no compose yet)], revisit_if: "Apple's container tool supports compose and the docker API; a needed tool keeps failing on the Docker socket emulation; the servers move to Podman"}
  - {name: podman-docker, role: the docker command running podman (Linux), why: muscle memory and scripts, alternatives: [alias], revisit_if: never}
  - {name: docker-compose, role: compose provider for podman compose / docker compose, why: "the reference compose implementation, talks to podman's socket", alternatives: [podman-compose], revisit_if: "podman compose gains a built-in provider"}
  - {name: lazydocker, role: container TUI, why: "works with Podman's socket via DOCKER_HOST", alternatives: [], revisit_if: never}
  - {name: python, role: language item (pyright, ruff, uv), why: "standard, fast; Mason installs pyright with npm so it needs node", alternatives: [basedpyright], revisit_if: "basedpyright or ty clearly better; pyright drops npm"}
  - {name: web, role: language item (ts_ls, prettierd), why: standard, alternatives: [vtsls, biome], revisit_if: "vtsls or biome become the norm"}
  - {name: ops, role: language item (Ansible, YAML, OpenTofu, Docker, shell), why: "matches the homelab repo", alternatives: [], revisit_if: "tofu-ls or ansible-language-server change hands"}
  - {name: go, role: language item (gopls, goimports, gofumpt), why: standard, alternatives: [], revisit_if: never really}
  - {name: rust, role: language item (rust-analyzer via rustup), why: "matches the toolchain", alternatives: [], revisit_if: "rust-analyzer distribution changes"}
  - {name: tailscale, role: Tailscale (+ copies inventory hosts into srv), why: "the homelab already uses it", alternatives: [], revisit_if: never}
  - {name: hyprland, role: "desktop item: Hyprland, keyboard-first tiling", why: "the TUI box's planned desktop; Lua config since 0.55, checked with --verify-config in tests and rig doctor", alternatives: [sway (no Lua, fewer effects), niri (scrolling only), KDE + wm item (kept for the KDE desktop)], revisit_if: "a Lua API break; the hyprlang removal lands; Arch drops a package it uses"}
  - {name: helium, role: browser, why: "Chromium without Google's services, uBlock Origin built in; one browser on Arch and macOS (Homebrew cask); Vimium works", alternatives: [LibreWolf (macOS cask disabled: unsigned builds fail Gatekeeper), Firefox, Brave], revisit_if: "Helium falls behind Chromium security releases; it reaches 1.0; LibreWolf ships signed macOS builds"}
  - {name: browser-default, role: OS setting, why: "links open in the chosen browser on KDE, Hyprland and GTK apps", alternatives: [], revisit_if: "KDE changes BrowserApplication; macOS gains a silent way to set it"}
  - {name: yay, role: "AUR helper on Arch: installed by the bootstrap, used for AUR items and rig update", why: "already the owner's helper; actively released (13.x, 2026), the larger community", alternatives: [paru (also active, 2.2 in Oct 2026; reviews PKGBUILDs by default; rig uses it if it's the only helper)], revisit_if: "yay goes unmaintained; paru clearly pulls ahead"}
  - {name: uwsm, role: Hyprland session manager, why: "the launch method the Hyprland wiki recommends: systemd scopes per app, clean logout", alternatives: [start-hyprland, plain exec-once], revisit_if: "Hyprland changes its recommended launcher"}
  - {name: waybar, role: Hyprland bar, why: "mature, CSS-styled, small config", alternatives: [quickshell (QML, much more to write), no bar], revisit_if: "it stops keeping up with Hyprland's IPC"}
  - {name: fuzzel, role: "launcher, and the clipboard/power/key menus", why: "small, fast; dmenu mode covers all four", alternatives: [hyprlauncher (v0.1, fewer dmenu uses), rofi (heavier to theme), walker (not in Arch repos)], revisit_if: "hyprlauncher matures and gains a dmenu mode"}
  - {name: mako, role: notifications, why: "minimal, D-Bus activated, include= for the colours", alternatives: [swaync (a panel), dunst], revisit_if: "never really"}
  - {name: hyprlock + hypridle, role: lock screen and idle, why: "Hyprland's own; required", alternatives: [swaylock, swayidle], revisit_if: "they move to Lua configs"}
  - {name: swayosd, role: volume/brightness/caps popup, why: "one small daemon; feedback even in fullscreen", alternatives: [none (the bar shows volume)], revisit_if: "Hyprland ships its own OSD"}
  - {name: hyprsunset, role: night light, why: "Hyprland's own; off until toggled", alternatives: [wlsunset], revisit_if: "never really"}
  - {name: "cliphist + grim + slurp + satty", role: "clipboard history, screenshots, annotation", why: "the standard Wayland pieces, small", alternatives: [hyprshot], revisit_if: "never really"}
  - {name: "wiremix + nmtui + bluetui", role: "audio, network, Bluetooth controls", why: "keyboard-first TUIs in a floating Ghostty, few packages", alternatives: [pavucontrol, nm-applet, blueman], revisit_if: "one goes unmaintained"}
  - {name: greetd + tuigreet, role: login screen where there is none, why: "tiny, terminal-styled; only installed when no display manager exists", alternatives: [SDDM (kept where present), ly], revisit_if: "never really"}
  - {name: github, role: gh CLI, why: "rig git logs in and uploads auth + signing keys with it", alternatives: [], revisit_if: "gh auth/ssh-key flags change"}
  - {name: gitlab, role: glab CLI, why: "rig git logs in and uploads keys (usage auth_and_signing) for gitlab.com and self-hosted GitLab", alternatives: [], revisit_if: "glab auth/ssh-key flags change"}
  - {name: gitea, role: "gt CLI (gitea-cli; replaced tea at 1.0, 2026-11)", why: "rig git logs in (token) and uploads keys for Gitea, Forgejo and Codeberg; 1.x promises stable commands, flags and --json fields", alternatives: [fj (Forgejo-only, less packaged), tea (superseded by gt)], revisit_if: "gt auth or ssh-key changes in a 2.0, or Forgejo's API drifts from Gitea's"}
  - {name: claude, role: coding agent, why: offered at setup, alternatives: [], revisit_if: "every review: install method (native installer)"}
  - {name: copilot, role: coding agent, why: offered at setup, alternatives: [], revisit_if: "every review: install method (npm @github/copilot / brew copilot-cli)"}
  - {name: codex, role: coding agent, why: offered at setup, alternatives: [], revisit_if: "every review: install method (npm @openai/codex / brew cask codex)"}
  - {name: gemini, role: coding agent, why: offered at setup, alternatives: [], revisit_if: "every review: install method (npm @google/gemini-cli / brew gemini-cli)"}
  - {name: opencode, role: coding agent, why: offered at setup, alternatives: [], revisit_if: "every review: install method (pacman / anomalyco tap / script)"}
  - {name: terminal-default, role: OS setting, why: Ghostty everywhere, alternatives: [], revisit_if: "KDE changes TerminalApplication/TerminalService; xdg-terminal-exec spec changes"}
  - {name: text-in-nvim, role: OS setting, why: open text in nvim, alternatives: [], revisit_if: never}
  - {name: mac-dock, role: OS setting, why: requested, alternatives: [], revisit_if: "macOS renames the Dock defaults"}
  - {name: mac-finder, role: OS setting, why: sensible for terminal users, alternatives: [], revisit_if: "macOS renames the Finder defaults"}
