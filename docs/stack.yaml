  - {name: mason.nvim, role: installs language tools, why: standard, alternatives: [], revisit_if: "registry or API changes (bootstrap.lua uses it)"}
  - {name: mason-lspconfig.nvim, role: enables Mason servers, why: standard, alternatives: [], revisit_if: "v3 API change"}
  - {name: nvim-lspconfig, role: server configs, why: standard, alternatives: [], revisit_if: "configs move into Neovim core"}
  - {name: conform.nvim, role: format on save, why: "per-filetype formatters, LSP fallback", alternatives: [efm (was used before), none-ls], revisit_if: never really}
