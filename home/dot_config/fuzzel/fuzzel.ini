# The launcher (mod+space), also the clipboard history, power menu and key
# list (desk). Colours from colors.ini (theme.yaml).
include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  "
icon-theme=Papirus-Dark
terminal=ghostty -e
layer=overlay
width=42
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22
match-mode=fzf

[border]
width=2
radius=4
