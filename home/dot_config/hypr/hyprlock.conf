# The lock screen (mod+escape, and after 10 idle minutes): gruvbox, a clock,
# the date and the password field. Colours from colors.conf (theme.yaml).
source = ~/.config/hypr/colors.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = snap, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 3, snap
    animation = fadeOut, 1, 3, snap
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $gray
    font_size = 18
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 4
    outer_color = $bg2
    inner_color = $bg1
    font_color = $fg
    check_color = $aqua
    fail_color = $red
    capslock_color = $yellow
    font_family = $font
    placeholder_text = password
    fail_text = $FAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
