# --- terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # truecolor for the outer terminal
set -as terminal-features ",*:extkeys"    # outer terminal understands extended keys
set -g extended-keys on                   # pass Shift+Enter, Ctrl+I vs Tab etc. to apps
set -g extended-keys-format csi-u
set -g allow-passthrough on               # app notifications/images get through tmux
set -g set-clipboard on                   # copy via OSC52 (works over SSH too)
set -g escape-time 10                     # no Esc lag in nvim
set -g focus-events on                    # nvim reloads files when you switch panes
set -g history-limit 50000
set -g mouse on

# --- basics -------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind -r h resize-pane -L 5
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 5

# --- copy mode ----------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- C-hjkl moves across nvim splits and tmux panes (vim-tmux-navigator) -------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l                    # prefix C-l: clear the screen

# --- pop-ups ------------------------------------------------------------------
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind f display-popup -E -w 90% -h 70% -d "#{pane_current_path}" "~/.local/bin/dev ls"
bind m display-popup -E -w 80% -h 60% "~/.local/bin/srv"

# --- key hints: prefix Space opens a menu of these keys -----------------------
# (like <leader> in nvim). An entry's key runs it from the menu; it's also the
# key after the prefix. Dimmed lines are keys that work without the prefix.
bind Space display-menu -T "#[align=centre] tmux keys (prefix = Ctrl-Space) " \
  "New tab"                   c  "new-window -c '#{pane_current_path}'" \
  "Next tab"                  n  "next-window" \
  "Previous tab"              p  "previous-window" \
  "Pick a tab or session"     w  "choose-tree -Zw" \
  "Rename this tab"           ,  "command-prompt -I '#W' { rename-window -- '%%' }" \
  "Close this tab"            X  "kill-window" \
  "" \
  "Split side by side"        \\ "split-window -h -c '#{pane_current_path}'" \
  "Split top and bottom"      -  "split-window -v -c '#{pane_current_path}'" \
  "Zoom this pane (toggle)"   z  "resize-pane -Z" \
  "Close this pane"           x  "kill-pane" \
  "-Move between panes: Ctrl-h/j/k/l (also into nvim)" "" "" \
  "-Resize: prefix h/j/k/l" "" "" \
  "" \
  "Workspaces (dev)"          f  "display-popup -E -w 90% -h 70% -d '#{pane_current_path}' '~/.local/bin/dev ls'" \
  "Servers (srv)"             m  "display-popup -E -w 80% -h 60% '~/.local/bin/srv'" \
  "Git (lazygit)"             g  "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit" \
  "" \
  "Scroll and copy (q quits)" [  "copy-mode" \
  "Detach (sessions keep running)" d "detach-client" \
  "Reload the config"         r  "source-file ~/.config/tmux/tmux.conf ; display-message 'tmux.conf reloaded'" \
  "Every key (tmux's list)"   ?  "list-keys -N"

# --- bell: a window whose program rang the bell lights up in the status bar ----
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- status bar ---------------------------------------------------------------
set -g status-position top
set -g status-justify absolute-centre
set -g status-right "#{@srv}"   # mounted servers: srv sets it when a mount comes or goes
set -g status-right-length 60
set -g status-interval 15
run-shell -b "~/.local/bin/srv _status --push"
set -g status-left "#{?@rig_window,,#S }#{?client_prefix,#[reverse] Space: keys #[noreverse],}"   # session name, except a Ghostty window's own
set -g status-left-length 30

# Colours, rendered from .chezmoidata/theme.yaml
source-file -q ~/.config/tmux/theme.conf
