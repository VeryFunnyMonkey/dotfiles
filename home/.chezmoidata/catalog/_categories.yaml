# Installer sections, in menu order. Items live in catalog/<category>.yaml.
# Item fields:
#   name, description        shown in the installer
#   packages                 logical package names (resolved per OS by packages.yaml);
#                            packages_<platform> (e.g. packages_darwin) only there
#   platforms                where it exists: arch fedora debian darwin wsl (default: all)
#   desktops                 only on these desktops: kde hyprland gnome macos (default: any)
#   display                  true = needs a display (not on headless machines)
#   needs                    runtimes: node go rust (runtimes.yaml)
#   nvim                     servers, system_servers, mason, formatters, parsers
#   note                     shown in the review when the item is skipped here
#   requires                 other items this one only makes sense with
#   includes                 other items selecting this one also selects
#   module                   the rig module that sets it up beyond packages
#                            (share/rig/modules/<name>.sh: services, logins, ...)
#   files                    target paths only this item brings (ignored when it isn't
#                            selected); files_<platform> only there
#   settings                 OS settings it applies (see catalog/settings.yaml); rig
#                            records each previous value and restores it on deselect
categories:
  - {id: cli, name: "CLI tools"}
  - {id: terminal, name: "Terminal & desktop"}
  - {id: tui, name: "TUI apps"}
  - {id: languages, name: "Languages"}
  - {id: homelab, name: "Homelab"}
  - {id: git, name: "Git"}
  - {id: containers, name: "Containers"}
  - {id: agents, name: "Coding agents"}
  - {id: settings, name: "OS settings"}
