# Host CLIs. rig git add selects the one for an account's host and uses it to
# log in and upload the key; deselect them freely, rig git falls back to
# copying the key for you to paste.
catalog:
  github:
    category: git
    name: GitHub CLI (gh)
    description: "logs in and uploads keys for GitHub accounts; PRs, issues and CI from the terminal"
    packages: [gh]
  gitlab:
    category: git
    name: GitLab CLI (glab)
    description: "logs in and uploads keys for GitLab accounts (gitlab.com or your own); MRs and pipelines from the terminal"
    packages: [glab]
  gitea:
    category: git
    name: Gitea CLI (gt)
    description: "logs in and uploads keys for Gitea, Forgejo and Codeberg accounts; PRs and issues from the terminal"
    packages: [gitea-cli]
  # Windows (WSL): git signs in through Windows (modules/gcm.sh)
  git-credential-manager:
    category: git
    name: Git Credential Manager (Windows)
    description: "git in WSL signs in through Windows: your Windows and work accounts (Entra/MSAL), Windows' credential store; Azure DevOps too"
    platforms: [windows]
    packages: [git-for-windows]
    module: gcm
    note: "Windows only (WSL)"
