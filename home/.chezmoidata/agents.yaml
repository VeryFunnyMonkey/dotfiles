# Coding agents offered at setup (pick none, one or several; change later with
# `rig agents add|remove|default`). Install methods live in rig's agents.sh and
# are checked against each vendor's docs at every stack review: they change often.
agentdefs:
  claude:
    name: Claude Code
    command: claude
    needs: []
  copilot:
    name: GitHub Copilot CLI
    command: copilot
    needs: [node]
  codex:
    name: OpenAI Codex CLI
    command: codex
    needs: [node]
  gemini:
    name: Gemini CLI
    command: gemini
    needs: [node]
  opencode:
    name: OpenCode
    command: opencode
    needs: []
