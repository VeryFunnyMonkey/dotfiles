# The declared system: every package this machine should have.
# Extra packages for one machine: `rig install <pkg>` (kept in that machine's config).
#
# Entries are logical names. Where each one comes from, and what it's called
# there, is worked out per machine (see dot_config/rig/packages.tsv.tmpl):
#   - Arch:          pacman for everything; the AUR (aur: below) through yay,
#                    which the bootstrap installs (paru is used if it's the only one)
#   - macOS:         Homebrew for everything
#   - Debian/Ubuntu,
#     Fedora:        the distro for the base system only (`native` below),
#                    Homebrew on Linux for the developer tools, which the
#                    distros ship too old or not at all
packages:
  # Always installed: what rig and the configs rely on. Everything else is a
  # catalog item (catalog/*.yaml), picked with `rig setup`.
  core:
    - bash     # rig needs 4+ (macOS ships 3.2)
    - zsh
    - tmux
    - neovim
    - git
    - openssh
    - curl
    - unzip
    - build-tools
    - tree-sitter-cli
    - fzf
    - ripgrep
    - fd
    - gum
    - rclone   # srv: mount servers over SSH
    - fuse3    # srv on Linux (FUSE is in the kernel; macOS uses NFS instead)

  # On Debian/Ubuntu and Fedora these come from the distro, everything else from brew.
  native: [bash, zsh, git, openssh, curl, unzip, build-tools, wl-clipboard, xclip, wslu, fuse3, podman, podman-docker, docker-compose]

  # Virtual packages: one logical name that means different packages (or none)
  # depending on the machine: "windows" (WSL), else the display (wayland, x11, ...).
  virtual:
    clipboard:
      windows: [win32yank, wslu]
      wayland: [wl-clipboard]
      x11: [xclip]

  # Installed by rig itself (share/rig/pkg/downloads.sh): on Debian/Ubuntu and
  # Fedora (not packaged suitably there), or on every platform.
  download: [nerd-font, tailscale]
  download_everywhere: [win32yank]

  # On Windows (WSL): installed on the Windows side, with winget (per user where
  # the package allows it, so no admin prompt).
  winget: [windows-terminal, powertoys, glazewm]

  # On Arch, from the AUR, through the AUR helper (yay; the bootstrap installs it).
  aur: [helium]

  # Packages that exist only for some managers (skipped elsewhere).
  only:
    wslu: [apt]

  # Per-manager names, where they differ from the logical name. "-" = not needed there.
  names:
    winget:
      windows-terminal: Microsoft.WindowsTerminal
      powertoys: Microsoft.PowerToys
      glazewm: glzr-io.glazewm
    aur:
      helium: helium-browser-bin
    pacman:
      build-tools: base-devel
      delta: git-delta
      gh: github-cli
      nerd-font: ttf-jetbrains-mono-nerd
    apt:
      openssh: openssh-client
      docker-compose: docker-compose-v2
      build-tools: build-essential
    dnf:
      openssh: openssh-clients
      build-tools: gcc make
    brew:
      delta: git-delta
      # macOS ships these
      zsh: "-"
      git: "-"
      openssh: "-"
      curl: "-"
      unzip: "-"
      build-tools: "-"
      fuse3: "-"     # macOS: srv uses rclone nfsmount, no FUSE
      podman-docker: "-"  # macOS: rig makes `docker` run podman instead
      nerd-font: "--cask font-jetbrains-mono-nerd-font"
      ghostty: "--cask ghostty"
      aerospace: "--cask nikitabobko/tap/aerospace"
      maccy: "--cask maccy"
      helium: "--cask helium-browser"
      tailscale: "--cask tailscale-app"
