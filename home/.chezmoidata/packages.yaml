# The declared system: every package this machine should have.
# Extra packages for one machine: `rig install <pkg>` (kept in that machine's config).
#
# Entries are logical names. Where each one comes from, and what it's called
# there, is worked out per machine (see dot_config/rig/packages.tsv.tmpl):
#   - Arch:          pacman for everything (yay/paru if present, for AUR names)
#   - macOS:         Homebrew for everything
#   - Debian/Ubuntu,
#     Fedora:        the distro for the base system only (`native` below),
#                    Homebrew on Linux for the developer tools, which the
#                    distros ship too old or not at all
packages:
  # Always installed: what rig and the configs rely on. Everything else is a
  # catalog item (catalog/*.yaml), picked with `rig setup`.
  core:
    - zsh
    - tmux
    - neovim
    - git
    - openssh
    - curl
    - unzip
    - build-tools
    - tree-sitter-cli
    - fzf
    - ripgrep
    - fd
    - gum
    - rclone   # srv: mount servers over SSH
    - fuse3    # srv on Linux (FUSE is in the kernel; macOS uses NFS instead)

  # On Debian/Ubuntu and Fedora these come from the distro, everything else from brew.
  native: [zsh, git, openssh, curl, unzip, build-tools, clipboard, wslu, fuse3]

  # Installed by rig itself on Debian/Ubuntu and Fedora (not packaged suitably there).
  download: [win32yank, tailscale]

  # Per-manager names, where they differ from the logical name. "-" = not needed there.
  names:
    pacman:
      build-tools: base-devel
      delta: git-delta
      gh: github-cli
      nerd-font: ttf-jetbrains-mono-nerd
    apt:
      openssh: openssh-client
      build-tools: build-essential
    dnf:
      openssh: openssh-clients
      build-tools: gcc make
    brew:
      delta: git-delta
      # macOS ships these
      zsh: "-"
      git: "-"
      openssh: "-"
      curl: "-"
      unzip: "-"
      build-tools: "-"
      clipboard: "-"
      fuse3: "-"     # macOS: srv uses rclone nfsmount, no FUSE
      nerd-font: "--cask font-jetbrains-mono-nerd-font"
      ghostty: "--cask ghostty"
      tailscale: "--cask tailscale"
