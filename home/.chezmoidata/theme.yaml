# One theme everywhere: gruvbox dark. Values feed the small *.tmpl fragments
# (tmux/theme.conf, zsh/theme.zsh, git/theme.gitconfig, lazygit/theme.yml,
# rig/theme.sh for rig, dev, srv and desk; fzf's colours: .chezmoitemplates/fzf-colors). nvim uses gruvbox.nvim.
theme:
  name: gruvbox-dark
  bat: gruvbox-dark
  delta: gruvbox-dark
  # gruvbox palette
  bg: "#282828"
  bg1: "#3c3836"
  bg2: "#504945"
  fg: "#ebdbb2"
  gray: "#928374"
  red: "#fb4934"
  green: "#b8bb26"
  yellow: "#fabd2f"
  blue: "#83a598"
  purple: "#d3869b"
  aqua: "#8ec07c"
  orange: "#fe8019"
  # the normal (darker) ANSI colours, for terminals that take all 16
  # (Windows Terminal); the ones above are the bright half
  normal: {red: "#cc241d", green: "#98971a", yellow: "#d79921", blue: "#458588", purple: "#b16286", aqua: "#689d6a", white: "#a89984"}
  # the prompt's 256-colour indices (kept from the original prompt)
  prompt_fg: 223
  prompt_bg1: 236
  prompt_bg2: 237
